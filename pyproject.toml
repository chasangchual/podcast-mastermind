[project]
name = "podcast-mastermind"
version = "0.1.0"
description = "Local-first podcast transcript ingestion and semantic search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "beautifulsoup4>=4.13,<5",
    "fastapi>=0.116,<1",
    "feedparser>=6.0,<7",
    "httpx>=0.28,<1",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.10,<3",
    "python-dateutil>=2.9,<3",
    "qdrant-client>=1.15,<2",
    "sqlalchemy>=2.0,<3",
    "typer>=0.16,<1",
    "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.1,<2",
    # faster-whisper 1.2 passes av.open(metadata_errors=...), which PyAV 19 removed.
    "av>=12,<19",
]
mlx = [
    "mlx-whisper>=0.4.2; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
diarization = [
    "pyannote.audio>=3.3,<4",
]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[project.scripts]
podcast-mastermind = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migration/versions/*.py" = ["E501"]
